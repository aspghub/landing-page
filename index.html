<!DOCTYPE html>
<html>
<head>
  <title>PopeWorld</title>
  <style>
    :root {
      --base: #1e1e2e;
      --text: #cdd6f4;
      --mauve: #cba6f7;
    }
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: var(--base); color: var(--text); }
    h1 { color: var(--text); }
    p { color: var(--text); }
    .fade.second { color: var(--mauve); }

    .fade {
      opacity: 0;
      animation: fadeInOut 6s ease-in-out infinite;
    }
    /* Second line starts half a second later */
    .fade.second { animation-delay: 0.5s; }

    @keyframes fadeInOut {
      0%   { opacity: 0; }
      30%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <p class="fade"><i>This is not the website you were looking for</i></p>
  <p class="fade second"><i>Move along, Move along...</i></p>
</body>
</html>
